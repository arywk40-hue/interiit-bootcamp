[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-indic-nlu"
version = "0.1.0"
description = "Leakage-aware Hinglish sentiment robustness benchmark"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

